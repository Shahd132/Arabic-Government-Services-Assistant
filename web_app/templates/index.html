<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المساعد الذكي – Smart Citizen Assistant</title>

    <!-- Bootstrap 5 RTL -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

    <style>

        body {
            background-color: #f8f9fa;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }

        #chat-window {
            border-radius: 20px;
            overflow: hidden;
        }

        #messages {
            background: #ffffff;
            height: 400px;
            overflow-y: auto;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 4px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
        }

        .bg-light.border {
            border-color: #dee2e6 !important;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Uploaded image preview */
        .uploaded-image {
            max-width: 300px;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid #dee2e6;
            display: block;
        }

        .message-image {
            max-width: 250px;
            max-height: 220px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
            display: block;
        }

        @media (max-width: 576px) {

            #messages {
                height: 300px !important;
            }

            .uploaded-image {
                max-width: 220px;
            }

            .message-image {
                max-width: 200px;
            }
        }

    </style>

</head>


<body>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10">


            <!-- ================= HEADER ================= -->

            <div class="text-center mb-4">

                <h1 class="display-5 fw-bold text-primary">

                    <i class="fas fa-robot"></i>

                    المساعد الذكي

                </h1>

                <p class="text-muted">
                    نظام معلومات حكومي متعدد الإدارات
                </p>

            </div>


            <!-- ================= CHAT WINDOW ================= -->

            <div
                id="chat-window"
                class="card shadow-sm border-0"
            >

                <!-- Messages -->

                <div
                    class="card-body p-4"
                    id="messages"
                >

                    <div
                        class="text-center text-muted my-5"
                        id="welcome-msg"
                    >

                        <i class="fas fa-comment-dots fa-3x mb-2"></i>

                        <p>
                            اطرح سؤالك عن الأحوال المدنية، الضرائب، أو المرور
                        </p>

                        <p class="small">
                            مثال: "إزاي أطلع بطاقة رقم قومي؟"
                        </p>

                    </div>

                </div>


                <!-- ================= INPUT AREA ================= -->

                <div class="card-footer bg-white border-0 p-3">


                    <form
                        id="chat-form"
                        class="d-flex flex-column gap-2"
                    >


                        <!-- Question -->

                        <div class="d-flex gap-2">

                            <input
                                type="text"
                                id="user-input"
                                class="form-control form-control-lg"
                                placeholder="اكتب سؤالك هنا..."
                                autocomplete="off"
                            >

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >

                                <i class="fas fa-paper-plane"></i>

                            </button>

                        </div>


                        <!-- File Upload -->

                        <div
                            class="d-flex gap-2 align-items-center"
                        >

                            <div class="file-upload-wrapper">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                >

                                    <i class="fas fa-upload"></i>

                                    رفع مستند

                                </button>

                                <input
                                    type="file"
                                    id="file-input"
                                    accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp,.tiff,.webp,image/webp"
                                >

                            </div>


                            <span
                                id="file-name"
                                class="small text-muted"
                            >
                                لم يتم رفع مستند
                            </span>


                            <button
                                type="button"
                                id="clear-file"
                                class="btn btn-outline-danger btn-sm d-none"
                            >

                                <i class="fas fa-times"></i>

                            </button>

                        </div>


                        <!-- Image Preview -->

                        <div
                            id="image-preview-container"
                            class="d-none"
                        >

                            <p class="small text-muted mb-1">
                                معاينة الصورة:
                            </p>

                            <img
                                id="image-preview"
                                class="uploaded-image"
                                src=""
                                alt="معاينة الصورة"
                            >

                        </div>


                    </form>


                    <!-- Bottom Controls -->

                    <div
                        class="d-flex justify-content-between mt-2 small text-muted"
                    >

                        <span id="typing-indicator"></span>


                        <button
                            id="reset-btn"
                            class="btn btn-outline-secondary btn-sm"
                        >

                            <i class="fas fa-undo-alt"></i>

                            محادثة جديدة

                        </button>

                    </div>

                </div>

            </div>


            <!-- ================= FOOTER ================= -->

            <div
                class="text-center mt-4 text-muted small"
            >

                <i class="fas fa-shield-alt"></i>

                جميع الإجابات مدعومة بمصادر رسمية

            </div>

        </div>

    </div>

</div>


<script>

// ============================================================
// ELEMENTS
// ============================================================

const chatForm =
    document.getElementById('chat-form');

const userInput =
    document.getElementById('user-input');

const messagesContainer =
    document.getElementById('messages');

const welcomeMsg =
    document.getElementById('welcome-msg');

const typingIndicator =
    document.getElementById('typing-indicator');

const fileInput =
    document.getElementById('file-input');

const fileNameSpan =
    document.getElementById('file-name');

const clearFileBtn =
    document.getElementById('clear-file');

const imagePreviewContainer =
    document.getElementById('image-preview-container');

const imagePreview =
    document.getElementById('image-preview');


// ============================================================
// FIX: Ensure the "رفع مستند" button opens the file dialog
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    const uploadBtn = document.querySelector('.file-upload-wrapper button');
    if (uploadBtn && fileInput) {
        uploadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fileInput.click();
        });
    }
});


// ============================================================
// STATE
// ============================================================

let selectedFile = null;


// ============================================================
// CHECK IF FILE IS IMAGE
// ============================================================

function isImageFile(file) {

    if (!file) {
        return false;
    }

    return file.type.startsWith('image/');

}


// ============================================================
// ADD MESSAGE
// ============================================================

function addMessage(type, content, meta = {}) {

    // Remove welcome message
    if (welcomeMsg) {
        welcomeMsg.remove();
    }


    const msgDiv =
        document.createElement('div');


    msgDiv.className =
        `mb-3 ${
            type === 'user'
                ? 'text-end'
                : 'text-start'
        }`;


    let html = '';


    // ========================================================
    // USER MESSAGE
    // ========================================================

    if (type === 'user') {

        let fileInfo =
            meta.fileName
                ? `📎 ${meta.fileName}`
                : '';


        let imageHtml = '';


        // Display image in chat
        if (meta.imageUrl) {

            imageHtml = `
                <img
                    src="${meta.imageUrl}"
                    class="message-image"
                    alt="الصورة المرفوعة"
                >
            `;

        }


        html = `

            <div
                class="d-inline-block p-3 rounded-3 bg-primary text-white"
                style="max-width: 80%;"
            >

                <div>
                    ${content}
                </div>

                ${
                    fileInfo
                        ? `<div class="small mt-2">
                            ${fileInfo}
                           </div>`
                        : ''
                }

                ${imageHtml}

            </div>

        `;

    }


    // ========================================================
    // ASSISTANT MESSAGE
    // ========================================================

    else {

        let metaHtml = '';


        // Department

        if (meta.department) {

            metaHtml += `

                <span
                    class="badge bg-secondary me-1"
                >
                    ${meta.department}
                </span>

            `;

        }


        // Confidence

        if (meta.confidence) {

            metaHtml += `

                <span
                    class="badge bg-info text-dark me-1"
                >
                    ${meta.confidence}
                </span>

            `;

        }


        // Sources

        if (
            meta.sources &&
            meta.sources.length
        ) {

            metaHtml += `

                <span
                    class="badge bg-light text-dark"
                >
                    📚 ${meta.sources.length} مصادر
                </span>

            `;

        }


        // Verification

        if (
            meta.verified !== undefined
        ) {

            metaHtml += `

                <span
                    class="badge ${
                        meta.verified
                            ? 'bg-success'
                            : 'bg-warning'
                    } me-1"
                >

                    ${
                        meta.verified
                            ? '✓ مدعوم'
                            : '⚠ غير مدعوم'
                    }

                </span>

            `;

        }


        // Document processed

        if (meta.documentProcessed) {

            metaHtml += `

                <span
                    class="badge bg-primary"
                >
                    📄 تم تحليل المستند
                </span>

            `;

        }


        html = `

            <div
                class="d-inline-block p-3 rounded-3 bg-light border"
                style="
                    max-width: 85%;
                    text-align: right;
                "
            >

                <div class="mb-2">
                    ${content}
                </div>

                <div class="small text-muted mt-2">

                    ${metaHtml}

                </div>

            </div>

        `;

    }


    msgDiv.innerHTML = html;


    messagesContainer.appendChild(msgDiv);


    // Scroll to bottom

    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

}


// ============================================================
// TYPING INDICATOR
// ============================================================

function setTyping(active) {

    typingIndicator.textContent =
        active
            ? '⏳ جاري البحث...'
            : '';

}


// ============================================================
// FILE SELECTION
// ============================================================

fileInput.addEventListener(
    'change',
    function () {

        if (
            this.files &&
            this.files.length > 0
        ) {

            selectedFile =
                this.files[0];


            // Show filename

            fileNameSpan.textContent =
                selectedFile.name;


            // Show clear button

            clearFileBtn.classList.remove(
                'd-none'
            );


            // =================================================
            // IMAGE PREVIEW
            // =================================================

            if (isImageFile(selectedFile)) {

                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        imagePreview.src =
                            event.target.result;


                        imagePreviewContainer.classList.remove(
                            'd-none'
                        );

                    };


                reader.readAsDataURL(
                    selectedFile
                );

            }

            else {

                // PDF or other document

                imagePreview.src = '';

                imagePreviewContainer.classList.add(
                    'd-none'
                );

            }

        }

        else {

            clearSelectedFile();

        }

    }
);


// ============================================================
// CLEAR FILE
// ============================================================

function clearSelectedFile() {

    fileInput.value = '';

    selectedFile = null;

    fileNameSpan.textContent =
        'لم يتم رفع مستند';

    clearFileBtn.classList.add(
        'd-none'
    );

    imagePreview.src = '';

    imagePreviewContainer.classList.add(
        'd-none'
    );

}


clearFileBtn.addEventListener(
    'click',
    clearSelectedFile
);


// ============================================================
// SUBMIT FORM
// ============================================================

chatForm.addEventListener(
    'submit',
    async (e) => {

        e.preventDefault();


        const question =
            userInput.value.trim();


        if (!question) {
            return;
        }


        // Save file information
        const fileToSend =
            selectedFile;


        const fileName =
            fileToSend
                ? fileToSend.name
                : null;


        // ----------------------------------------------------
        // Show local preview immediately
        // ----------------------------------------------------

        let localImageUrl = null;


        if (
            fileToSend &&
            isImageFile(fileToSend)
        ) {

            localImageUrl =
                URL.createObjectURL(
                    fileToSend
                );

        }


        // ----------------------------------------------------
        // Clear input
        // ----------------------------------------------------

        userInput.value = '';

        userInput.disabled = true;


        // ----------------------------------------------------
        // Build FormData
        // ----------------------------------------------------

        const formData =
            new FormData();


        formData.append(
            'question',
            question
        );


        if (fileToSend) {

            formData.append(
                'document',
                fileToSend
            );

        }


        // ----------------------------------------------------
        // Add user message
        // ----------------------------------------------------

        addMessage(
            'user',
            question,
            {
                fileName: fileName,
                imageUrl: localImageUrl
            }
        );


        // ----------------------------------------------------
        // Typing
        // ----------------------------------------------------

        setTyping(true);


        try {

            // =================================================
            // SEND TO FLASK
            // =================================================

            const response =
                await fetch(
                    '/ask',
                    {
                        method: 'POST',
                        body: formData
                    }
                );


            const data =
                await response.json();


            // =================================================
            // SUCCESS
            // =================================================

            if (response.ok) {

                const meta = {

                    department:
                        data.department,

                    confidence:
                        data.confidence,

                    sources:
                        data.sources,

                    verified:
                        data.verified,

                    documentProcessed:
                        data.document_processed || false

                };


                addMessage(
                    'assistant',
                    data.answer,
                    meta
                );

            }


            // =================================================
            // ERROR
            // =================================================

            else {

                addMessage(
                    'assistant',
                    '⚠️ عذراً، حدث خطأ: ' +
                    (data.error || 'خطأ غير معروف')
                );

            }


        }

        catch (err) {

            console.error(
                'Request error:',
                err
            );


            addMessage(
                'assistant',
                '⚠️ تعذر الاتصال بالخادم.'
            );

        }


        finally {

            setTyping(false);

            userInput.disabled = false;

            userInput.focus();


            // ------------------------------------------------
            // Clear selected file after sending
            // ------------------------------------------------

            clearSelectedFile();


            // Release browser object URL

            if (localImageUrl) {

                URL.revokeObjectURL(
                    localImageUrl
                );

            }

        }

    }
);


// ============================================================
// RESET CONVERSATION
// ============================================================

document
    .getElementById('reset-btn')
    .addEventListener(
        'click',
        async () => {

            try {

                await fetch(
                    '/reset',
                    {
                        method: 'POST'
                    }
                );

            }

            catch (err) {

                console.error(
                    err
                );

            }


            // Clear messages

            messagesContainer.innerHTML = `

                <div
                    class="text-center text-muted my-5"
                    id="welcome-msg"
                >

                    <i
                        class="fas fa-comment-dots fa-3x mb-2"
                    ></i>

                    <p>
                        تم بدء محادثة جديدة
                    </p>

                </div>

            `;


            // Clear file

            clearSelectedFile();

        }
    );


// ============================================================
// AUTO FOCUS
// ============================================================

window.onload = () => {

    userInput.focus();

};

</script>

</body>
</html>
